[package]
name = "ramstore"
version = "0.1.0"
edition = "2021"

[lib]
name = "ramstore"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
once_cell = "1.19"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"

